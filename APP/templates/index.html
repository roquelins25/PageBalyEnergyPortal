<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BI Portal - Baly Energy</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --yellow: #FFD500;
            --ink: #141411;
            --ink-2: #1C1B17;
            --line-dark: #2C2B25;
            --txt-dark: #D9D7CC;
            --mut-dark: #8A887E;
            --bg: #F5F4EF;
            --card: #FFFFFF;
            --line: #E6E4DB;
            --txt: #1B1A16;
            --mut: #6B695F;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--txt);
        }
        button { font-family: inherit; cursor: pointer; }
        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 2px solid var(--yellow);
            outline-offset: 2px;
        }

        .app { display: flex; height: 100vh; height: 100dvh; width: 100%; }

        /* ── SIDEBAR ───────────────────────── */
        .sidebar {
            flex: 0 0 272px;
            width: 272px;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px 14px;
            z-index: 30;
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
        }
        .side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
        .side-head img { height: 56px; width: auto; object-fit: contain; }
        .icon-btn-dark {
            width: 36px; height: 36px; border-radius: 8px; border: 0;
            background: transparent; color: #A8A69C;
            display: none; align-items: center; justify-content: center;
        }
        .icon-btn-dark:hover { background: #26251F; color: #fff; }

        .search { position: relative; display: block; }
        .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mut-dark); }
        .search input {
            width: 100%; height: 40px; border-radius: 10px;
            border: 1px solid var(--line-dark); background: var(--ink-2);
            color: #F2F1EA; font-size: 14px; font-family: inherit;
            padding: 0 12px 0 36px;
        }
        .search input::placeholder { color: var(--mut-dark); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

        .nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .nav::-webkit-scrollbar { width: 4px; }
        .nav::-webkit-scrollbar-thumb { background: var(--line-dark); border-radius: 10px; }

        .group-btn {
            width: 100%; display: flex; align-items: center; gap: 10px;
            height: 40px; padding: 0 10px; border: 0; border-radius: 8px;
            background: transparent; color: var(--txt-dark);
            font-size: 13px; font-weight: 600; text-align: left;
        }
        .group-btn:hover { background: #1F1E1A; }
        .group-btn .name { flex: 1; }
        .group-btn .count { font-size: 11px; color: var(--mut-dark); }
        .group-btn .chev { color: var(--mut-dark); transition: transform .2s; }
        .group.open .chev { transform: rotate(180deg); }

        .group-items {
            display: none; flex-direction: column; gap: 2px;
            margin: 2px 0 8px 12px; padding-left: 10px;
            border-left: 1px solid var(--line-dark);
        }
        .group.open .group-items { display: flex; }

        .item {
            display: flex; align-items: center; gap: 8px;
            min-height: 40px; padding: 6px 10px;
            border: 0; border-radius: 8px; background: transparent;
            color: var(--txt-dark); font-size: 14px; font-weight: 500; text-align: left;
        }
        .item:hover { background: #1F1E1A; }
        .item .label { flex: 1; }
        .item.active { background: #26251F; color: var(--yellow); font-weight: 600; }
        .item .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--yellow); display: none; }
        .item.active .dot { display: block; }
        .item.soon { color: var(--mut-dark); cursor: not-allowed; }
        .item.soon:hover { background: transparent; }
        .pill {
            font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
            color: #E0B800; background: #2A2820; border-radius: 999px; padding: 3px 8px;
        }
        .no-result { margin: 12px 10px; font-size: 13px; color: var(--mut-dark); display: none; }

        .dev-link {
            display: none; /* Área de desenvolvimento desativada temporariamente (mesmo comportamento anterior) */
            align-items: center; gap: 10px; height: 40px; padding: 0 10px;
            border-top: 1px solid var(--line-dark); border-radius: 8px;
            color: #A8A69C; font-size: 13px; text-decoration: none;
        }

        /* ── MAIN ───────────────────────── */
        .main {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column;
            padding: 20px 28px 16px; gap: 16px;
        }
        .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
        .top-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .menu-btn {
            display: none; width: 44px; height: 44px; border-radius: 10px;
            border: 1px solid #E1DFD5; background: #fff; color: #3A3830;
            align-items: center; justify-content: center;
        }
        .titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .crumb { font-size: 13px; color: var(--mut); }
        .titles h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
        .actions { display: flex; gap: 8px; }
        .btn-icon {
            width: 44px; height: 44px; border-radius: 10px;
            border: 1px solid #E1DFD5; background: #fff; color: #3A3830;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { border-color: var(--ink); }
        .btn-primary {
            height: 44px; padding: 0 16px; border-radius: 10px; border: 0;
            background: var(--yellow); color: var(--ink);
            font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background: #F2C900; }

        .tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 36px; }
        .tab {
            display: flex; align-items: center; border-radius: 999px;
            border: 1px solid #E1DFD5; background: #fff;
        }
        .tab.active { background: var(--ink); border-color: var(--ink); }
        .tab .t-pick {
            height: 36px; padding: 0 6px 0 14px; border: 0; background: transparent;
            font-size: 13px; font-weight: 600; color: #3A3830;
        }
        .tab.active .t-pick { color: var(--yellow); }
        .tab .t-close {
            width: 32px; height: 36px; border: 0; background: transparent;
            color: #3A3830; opacity: .7; display: flex; align-items: center; justify-content: center;
        }
        .tab.active .t-close { color: var(--yellow); }

        .frame {
            flex: 1; min-height: 420px;
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            overflow: hidden; position: relative;
        }
        .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
        .empty {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center;
            color: var(--mut); font-size: 14px;
        }
        .frame.is-empty .empty { display: flex; }
        .frame.is-empty iframe { display: none; }

        .foot { font-size: 12px; color: var(--mut); }

        .overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 20;
            opacity: 0; pointer-events: none; transition: opacity .3s;
        }

        /* ── MOBILE / TABLET ───────────────────────── */
        @media (max-width: 1023px) {
            .sidebar {
                position: fixed; top: 0; left: 0; height: 100%;
                width: 288px; max-width: 86vw; transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .overlay.show { opacity: 1; pointer-events: auto; }
            .icon-btn-dark { display: flex; }
            .menu-btn { display: flex; }
            .main { padding: 12px 14px 12px; }
            .titles h1 { font-size: 20px; }
            .btn-primary span.txt { display: none; }
            .btn-primary { padding: 0; width: 44px; justify-content: center; }
        }
    </style>
</head>

<body>
<div class="app">

    <div id="overlay" class="overlay"></div>

    <!-- ── SIDEBAR ───────────────────────── -->
    <aside id="sidebar" class="sidebar">
        <div class="side-head">
            <img src="{{ url_for('static', filename='img/Baly-Logotipo_Principal-Amarelo.png') }}" alt="Baly Energy Drink" />
            <button id="closeMenu" class="icon-btn-dark" aria-label="Fechar menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span class="sr-only">Buscar relatório</span>
            <input id="search" type="text" placeholder="Buscar relatório" autocomplete="off" />
        </label>

        <nav id="nav" class="nav" aria-label="Relatórios"></nav>
        <p id="noResult" class="no-result">Nenhum relatório encontrado.</p>

        <!-- Área de Desenvolvimento — desativado temporariamente
        <a class="dev-link" href="{{ url_for('main.development_entry') }}" target="_blank" rel="noopener noreferrer">Área de desenvolvimento</a>
        -->
    </aside>

    <!-- ── MAIN ───────────────────────── -->
    <main class="main">
        <header class="top">
            <div class="top-left">
                <button id="openMenu" class="menu-btn" aria-label="Abrir menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div class="titles">
                    <span id="crumb" class="crumb">Portal BI</span>
                    <h1 id="title">Selecione um relatório</h1>
                </div>
            </div>
            <div class="actions">
                <button id="btnRefresh" class="btn-icon" aria-label="Atualizar relatório">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>
                </button>
                <button id="btnFull" class="btn-icon" aria-label="Tela cheia">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                </button>
                <button id="btnOpen" class="btn-primary" aria-label="Abrir no Power BI">
                    <span class="txt">Abrir no Power BI</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
                </button>
            </div>
        </header>

        <div id="tabs" class="tabs"></div>

        <section id="frame" class="frame">
            <iframe id="dashboardFrame" title="Relatório Power BI" src="about:blank" allowfullscreen></iframe>
            <div class="empty">Escolha um relatório no menu.</div>
        </section>

        <footer class="foot">© 2026 Baly Energy — BI Portal</footer>
    </main>
</div>

<script>
    // ── Dados: grupos e relatórios (links preservados do portal original) ──
    var TENANT = "&autoAuth=true&ctid=639f33fc-093c-4be7-ad0c-7003f74c9b96";
    var EMBED  = "https://app.powerbi.com/reportEmbed?reportId=";
    var VIEW   = "https://app.powerbi.com/view?r=";

    var AREAS = [
        { id: "fin", name: "Financeiro", items: [
            { id: "financeiro", label: "Financeiro", src: VIEW + "eyJrIjoiYzIwNTAwNGEtZjI5NS00N2RlLWIyMWMtYTRiN2ZhYmVlNmFhIiwidCI6IjYzOWYzM2ZjLTA5M2MtNGJlNy1hZDBjLTcwMDNmNzRjOWI5NiJ9" },
            { id: "producao-fin", label: "Produção", soon: true },
            { id: "po", label: "Aprovações de PO", soon: true }
        ] },
        { id: "com", name: "Comercial", items: [
            { id: "comercial-externo", label: "Comercial Externo", src: EMBED + "d5dc7877-f791-455a-94cb-217ec5b7049d" + TENANT },
            { id: "comercial-interno", label: "Comercial Interno", src: EMBED + "412922e4-038a-40d0-8c29-baf9199bedf2" + TENANT }
        ] },
        { id: "log", name: "Logística", items: [
            { id: "producao-log", label: "Produção", soon: true }
        ] },
        { id: "cont", name: "Contabilidade", items: [
            { id: "icms", label: "Controle de ICMS ST", src: EMBED + "f92c4f4b-91b5-4595-8129-0d8877b7733e" + TENANT },
            { id: "balanco", label: "Balanço por Período", src: VIEW + "eyJrIjoiNWNmMDAyODItMTI5ZS00N2U2LTkyMmQtODRkYTBjZjA3MjcxIiwidCI6IjYzOWYzM2ZjLTA5M2MtNGJlNy1hZDBjLTcwMDNmNzRjOWI5NiJ9" }
        ] },
        { id: "ctrl", name: "Controladoria", items: [
            { id: "precos", label: "Preços de Venda e Lucratividade", src: EMBED + "d759d3e4-21d0-4ad9-9d75-8415a95bd4e9" + TENANT },
            { id: "dre", label: "DRE Cliente", src: EMBED + "1ea9e66d-ff40-42cc-af5b-56e2bfebbfc6" + TENANT },
            { id: "dev", label: "Devoluções", src: EMBED + "6f1dcc90-a3f7-44c2-bdb5-6384966da9f7" + TENANT },
            { id: "margem", label: "Margem Contribuição", src: EMBED + "436a43eb-3609-42c9-9d50-ad4b890582a8" + TENANT }
        ] }
    ];

    var state = {
        q: "",
        active: "comercial-externo",           // mesmo relatório que o portal abria por padrão
        tabs: ["comercial-externo"],
        open: { com: true }
    };

    var $ = function (id) { return document.getElementById(id); };
    var nav = $("nav"), tabsEl = $("tabs"), iframe = $("dashboardFrame"), frame = $("frame");

    function find(id) {
        for (var i = 0; i < AREAS.length; i++) {
            for (var j = 0; j < AREAS[i].items.length; j++) {
                if (AREAS[i].items[j].id === id) return { area: AREAS[i], item: AREAS[i].items[j] };
            }
        }
        return null;
    }

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
    }

    var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    var XICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

    // ── Render: sidebar ──
    function renderNav() {
        var q = state.q.trim().toLowerCase();
        var shown = 0;
        nav.innerHTML = "";

        AREAS.forEach(function (a) {
            var items = a.items.filter(function (it) {
                return !q || it.label.toLowerCase().indexOf(q) !== -1;
            });
            if (q && items.length === 0) return;
            shown += items.length;

            var isOpen = q ? true : !!state.open[a.id];
            var g = el("div", "group" + (isOpen ? " open" : ""));

            var btn = el("button", "group-btn");
            btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
            btn.appendChild(el("span", "name", a.name));
            btn.appendChild(el("span", "count", String(a.items.length)));
            btn.insertAdjacentHTML("beforeend", CHEV);
            btn.addEventListener("click", function () {
                state.open[a.id] = !state.open[a.id];
                renderNav();
            });
            g.appendChild(btn);

            var list = el("div", "group-items");
            items.forEach(function (it) {
                var b = el("button", "item" + (it.soon ? " soon" : "") + (state.active === it.id ? " active" : ""));
                b.appendChild(el("span", "label", it.label));
                if (it.soon) b.appendChild(el("span", "pill", "Em breve"));
                b.appendChild(el("span", "dot"));
                if (it.soon) b.setAttribute("aria-disabled", "true");
                b.addEventListener("click", function () {
                    if (it.soon) return;
                    openReport(it.id);
                    closeSidebar();
                });
                list.appendChild(b);
            });
            g.appendChild(list);
            nav.appendChild(g);
        });

        $("noResult").style.display = shown === 0 ? "block" : "none";
    }

    // ── Render: abas ──
    function renderTabs() {
        tabsEl.innerHTML = "";
        state.tabs.forEach(function (id) {
            var f = find(id);
            var t = el("div", "tab" + (state.active === id ? " active" : ""));
            var pick = el("button", "t-pick", f.item.label);
            pick.addEventListener("click", function () { openReport(id); });
            var close = el("button", "t-close");
            close.setAttribute("aria-label", "Fechar aba " + f.item.label);
            close.innerHTML = XICON;
            close.addEventListener("click", function () { closeTab(id); });
            t.appendChild(pick);
            t.appendChild(close);
            tabsEl.appendChild(t);
        });
    }

    // ── Render: cabeçalho + iframe ──
    function renderHeader() {
        var cur = state.active ? find(state.active) : null;
        $("crumb").textContent = cur ? cur.area.name : "Portal BI";
        $("title").textContent = cur ? cur.item.label : "Selecione um relatório";
        frame.classList.toggle("is-empty", !cur);
        var src = cur ? cur.item.src : "about:blank";
        if (iframe.getAttribute("data-current") !== src) {
            iframe.setAttribute("data-current", src);
            iframe.src = src;
        }
    }

    function render() { renderNav(); renderTabs(); renderHeader(); }

    function openReport(id) {
        var f = find(id);
        if (!f || f.item.soon) return;
        if (state.tabs.indexOf(id) === -1) state.tabs.push(id);
        state.active = id;
        state.open[f.area.id] = true;
        render();
    }

    function closeTab(id) {
        state.tabs = state.tabs.filter(function (x) { return x !== id; });
        if (state.active === id) state.active = state.tabs.length ? state.tabs[state.tabs.length - 1] : null;
        render();
    }

    // ── Sidebar mobile ──
    function openSidebar() {
        $("sidebar").classList.add("open");
        $("overlay").classList.add("show");
    }
    function closeSidebar() {
        $("sidebar").classList.remove("open");
        $("overlay").classList.remove("show");
    }
    $("openMenu").addEventListener("click", openSidebar);
    $("closeMenu").addEventListener("click", closeSidebar);
    $("overlay").addEventListener("click", closeSidebar);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSidebar(); });
    window.addEventListener("resize", function () { if (window.innerWidth >= 1024) closeSidebar(); });

    // ── Busca ──
    $("search").addEventListener("input", function (e) {
        state.q = e.target.value;
        renderNav();
    });

    // ── Ações do cabeçalho ──
    $("btnRefresh").addEventListener("click", function () {
        var s = iframe.getAttribute("data-current");
        if (s && s !== "about:blank") { iframe.src = "about:blank"; setTimeout(function () { iframe.src = s; }, 50); }
    });
    $("btnFull").addEventListener("click", function () {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
    });
    $("btnOpen").addEventListener("click", function () {
        var s = iframe.getAttribute("data-current");
        if (s && s !== "about:blank") window.open(s, "_blank", "noopener");
    });

    render();
</script>

</body>
</html>
